<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F7F6F2" />
  <meta name="description" content="Home Gym Log — strength training tracker for Elliott and Chloe" />
  <title>Home Gym Log</title>

  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="./icon-192.png" type="image/png" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <link rel="stylesheet" href="./app-redesign.css?v=2.0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Home Gym Log" />

  <style>
    html, body { margin: 0; }

    /* --- HIG-aligned polish, applied globally so it survives app updates --- */

    /* Clarity: never let iOS auto-zoom the page when a field is focused —
       Safari does this automatically for any input under 16px, which is a
       jarring, disorienting layout shift. */
    input, select, textarea { font-size: 16px !important; }

    /* Clarity / accessibility: a visible, on-brand focus ring for keyboard
       and switch-control navigation (the app didn't suppress the default,
       but browser defaults look inconsistent on a dark background). */
    button:focus-visible, a:focus-visible, input:focus-visible,
    select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible {
      outline: 2px solid #7AA6FF;
      outline-offset: 2px;
    }

    /* Deference: respect the iPhone home-indicator / notch safe areas so
       controls near the bottom or edges are never obscured. */
    body { padding-bottom: env(safe-area-inset-bottom); }

    /* Consistency: standard cross-browser tap feedback and text handling. */
    button, [role="button"] { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

    /* Feedback: every tappable control should read as tappable and give a
       little press feedback, matching platform-native affordances. */
    button, select, input, a { cursor: pointer; }
    input, textarea { cursor: text; }
    button:active { opacity: 0.85; }

    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
    }
  </style>
  <script>
    try {
      const appearance = localStorage.getItem("hg_appearance") || "system";
      if (appearance === "light" || appearance === "dark") {
        document.documentElement.dataset.theme = appearance;
      }
    } catch (_) {}
  </script>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-messaging-compat.js"></script>
  <script src="./firebase-config.js?v=2.0"></script>
  <script src="./notifications.js?v=2.0"></script>
  <script src="./app.bundle.js?v=2.0"></script>
  <script src="./app-redesign.js?v=2.0"></script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", async () => {
        let refreshing = false;
        navigator.serviceWorker.addEventListener("controllerchange", () => {
          if (refreshing) return;
          refreshing = true;
          window.location.reload();
        });
        try {
          const registration = await navigator.serviceWorker.register("./sw.js", { updateViaCache: "none" });
          const offerUpdate = () => {
            window.HG_UPDATE_AVAILABLE = true;
            window.dispatchEvent(new CustomEvent("hg-update-available"));
          };
          const inspectWaiting = () => {
            if (registration.waiting && navigator.serviceWorker.controller) offerUpdate();
          };
          inspectWaiting();
          registration.addEventListener("updatefound", () => {
            const worker = registration.installing;
            worker && worker.addEventListener("statechange", () => {
              if (worker.state === "installed" && navigator.serviceWorker.controller) offerUpdate();
            });
          });
          window.HG_applyUpdate = () => {
            if (registration.waiting) registration.waiting.postMessage({ type: "SKIP_WAITING" });
            else registration.update();
          };
          window.setInterval(() => registration.update().catch(() => {}), 60 * 60 * 1000);
        } catch (err) {
          console.warn("Service worker registration failed:", err);
        }
      });
    }
  </script>
</body>
</html>
